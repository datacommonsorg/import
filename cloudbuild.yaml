steps:
  - name: 'maven:3.9.1'
    args: ['package']
    entrypoint: mvn
    secretEnv:
      - DC_API_KEY

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'storage'
      - 'cp'
      - '--cache-control=no-cache,max-age=0'
      - 'tool/target/datacommons-import-tool-0.1-SNAPSHOT-jar-with-dependencies.jar'
      - 'gs://${_GCS_BUCKET}/import_tools/import-tool.jar'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'builds'
      - 'triggers'
      - 'run'
      - 'dc-import-automation'
      - '--region=global'
      - '--branch=master'
      - '--substitutions=_FORCE_EXECUTOR=true'

substitutions:
  _GCS_BUCKET: 'datacommons_public'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dc-api-key/versions/latest
      env: DC_API_KEY
