# Parent Cloud Build configuration that orchestrates Test and Production deployments.
# Usage: gcloud builds submit . --config=cloudbuild.yaml --project=datcom-ci

substitutions:
  _AR_REPO_URL: 'us-docker.pkg.dev/datcom-ci/gcr.io'
  _VERSION: '${SHORT_SHA}'
  _PROD_TAG: 'stable'

steps:

# 1. Build services and helper images
- id: 'build-services'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'builds'
    - 'submit'
    - '.'
    - '--config=pipeline/workflow/build-services.yaml'
    - '--substitutions=_AR_REPO_URL=${_AR_REPO_URL},_VERSION=${_VERSION}'

# 2. Trigger Test Build (Child)
- id: 'deploy-test'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'builds'
    - 'submit'
    - '.'
    - '--config=deploy-services.yaml'
    - '--substitutions-file=config-test.yaml'
    - '--substitutions=_VERSION=${_VERSION}'
  dir: 'pipeline/workflow'

# 3. Run E2E Tests on Test Environment
- id: 'e2e-test'
  name: 'ghcr.io/astral-sh/uv:python3.11-bookworm'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      uv run python spanner_ingestion_test.py
  env:
    - 'PROJECT_ID=datcom-ci'
    - 'LOCATION=us-central1'
    - 'SPANNER_DATABASE_PATH=projects/datcom-ci/instances/datcom-spanner-test/databases/dc-test-db'
    - 'GCS_BUCKET_ID=datcom-ci-test'
  dir: 'pipeline/workflow'

# 4. Trigger Staging Build (Child)
- id: 'deploy-staging'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'builds'
    - 'submit'
    - '.'
    - '--config=deploy-services.yaml'
    - '--substitutions-file=config-staging.yaml'
    - '--substitutions=_VERSION=${_VERSION}'
  dir: 'pipeline/workflow'

# 5. Promote prod version
- id: 'update-version'
  name: 'gcr.io/cloud-builders/gcloud'
  args: ['builds', 'submit', '.', '--config', 'update-version.yaml', '--substitutions', '_AR_REPO_URL=${_AR_REPO_URL},_PROD_TAG=${_PROD_TAG},_VERSION=${_VERSION}']
  dir: 'pipeline/workflow'

# 6. Trigger Production Build (Child)
- id: 'deploy-prod'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'builds'
    - 'submit'
    - '.'
    - '--config=deploy-services.yaml'
    - '--substitutions-file=config-prod.yaml'
    - '--substitutions=_VERSION=${_PROD_TAG}'
  dir: 'pipeline/workflow'

options:
  logging: CLOUD_LOGGING_ONLY
