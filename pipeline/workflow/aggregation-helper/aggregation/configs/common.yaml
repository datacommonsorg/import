calculations:
  # Generates linkedMember edges (variable -> ancestor topic).
  - name: "Global: Linked Member Edges"
    type: LINKED_MEMBER
    stage: 0
    input_imports:
      - "*"

  # Generates linkedMemberOf edges (node -> ancestor group).
  - name: "Global: Linked MemberOf Edges"
    type: LINKED_MEMBER_OF
    stage: 0
    input_imports:
      - "*"

  # Generates linkedContainedInPlace edges and LinkedEdge rows.
  - name: "Global: Linked ContainedInPlace Edges"
    type: LINKED_CONTAINED_IN_PLACE
    stage: 0
    input_imports:
      - "*"

  # Generates summary statistics in the KeyValueStore table
  - name: "Global: KeyValueStore Provenance & Lineage Summary"
    type: PROVENANCE_SUMMARY
    stage: 0
    input_imports:
      - "*"

  # Generates the Statistical Variable hierarchy/verticals
  - name: "Global: StatVar Group Hierarchy & Verticals"
    type: STAT_VAR_GROUPS
    stage: 0
    input_imports:
      - "schema"

  # Generates node properties (types rollup and resolved names) into Node table
  - name: "Global: Node Properties (Types & Names Rollup)"
    type: NODE_PROPERTIES
    stage: 0
    input_imports:
      - "schema"
      - "place"


