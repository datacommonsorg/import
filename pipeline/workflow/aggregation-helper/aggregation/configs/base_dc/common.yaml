# Note: This file is temporary and is added to avoid making changes that are Base DC
# specific that could impact DCP workflows consuming common.yaml. In Base DC, the
# workflow will be hardcoded to pass this file path explicitly.

calculations:
  # Generates linkedMember edges (variable -> ancestor topic).
  - name: "Global: Linked Member Edges"
    type: LINKED_MEMBER
    stage: 0
    input_imports:
      - "Schema"

  # Generates linkedMemberOf edges (node -> ancestor group).
  # STAT_VAR_GROUPS also writes linkedMemberOf rows for Schema. Keep both listing
  # the same imports so they always run together.
  - name: "Global: Linked MemberOf Edges"
    type: LINKED_MEMBER_OF
    stage: 0
    input_imports:
      - "Schema"

  # Generates linkedContainedInPlace edges and LinkedEdge rows.
  # Every import whose entities need linked containment rows must be listed here: the
  # LinkedEdge table (and the linkedContainedInPlace rows in Edge) only ever hold
  # rows for imports that went through this step.
  - name: "Global: Linked ContainedInPlace Edges"
    type: LINKED_CONTAINED_IN_PLACE
    stage: 0
    input_imports:
      - "Place"
      - "FARS_CrashNodes"
      - "CycloneNOAA_Entities"

  # Generates summary statistics in the KeyValueStore table
  - name: "Global: KeyValueStore Provenance & Lineage Summary"
    type: PROVENANCE_SUMMARY
    stage: 0
    input_imports:
      - "*"

  # Generates the Statistical Variable hierarchy/verticals
  - name: "Global: StatVar Group Hierarchy & Verticals"
    type: STAT_VAR_GROUPS
    stage: 0
    input_imports:
      - "Schema"
    should_prune_single_child_svgs: true

  # Generates node properties (types rollup and resolved names) into Node table
  - name: "Global: Node Properties (Types & Names Rollup)"
    type: NODE_PROPERTIES
    stage: 0
    input_imports:
      - "Schema"
      - "Place"

