main:
  params: [args]
  steps:
    - init:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("LOCATION")}
          - imageUri: ${default(map.get(args, "imageUri"), "us-docker.pkg.dev/datcom-ci/gcr.io/dc-import-executor:stable")}
          - jobId: ${text.replace_all(text.to_lower(text.substring(text.split(args.importName, ":")[1], 0, 50) + "-" + string(int(sys.now()))), "_", "-")}
          - importName: ${args.importName}
          - importConfig: ${default(map.get(args, "importConfig"), "{}")}
          - gcsMountBucket: ${sys.get_env("GCS_MOUNT_BUCKET")}
          - gcsImportBucket: ${sys.get_env("GCS_BUCKET_ID")}
          - gcsMountPath: "/tmp/gcs"
          - helper_service: ${default(sys.get_env("INGESTION_HELPER_SERVICE"), "ingestion-helper-service")}
          - helperUrl: ${"https://" + helper_service + "-" + sys.get_env("PROJECT_NUMBER") + "." + region + ".run.app"}
          - spanner_workflow: ${default(sys.get_env("SPANNER_INGESTION_WORKFLOW_NAME"), "spanner-ingestion-workflow")}
          - runStaging: ${default(map.get(args, "runStaging"), true)}
          - stagingResult: "SKIPPED"
          - runProd: ${default(map.get(args, "runProd"), false)}
          - prodResult: "SKIPPED"
          - startTime: ${sys.now()}
          - defaultResources:
              machine: "n2-standard-8"
              cpu: 8000
              memory: 32768
              disk: 100
          - resources: ${default(map.get(args, "resources"), defaultResources)}
    - runImportJob:
        try:
          call: googleapis.batch.v1.projects.locations.jobs.create
          args:
            parent: ${"projects/" + projectId + "/locations/" + region}
            jobId: ${jobId}
            body:
              allocationPolicy:
                instances:
                - policy:
                    machineType: ${resources.machine}
                    provisioningModel: "STANDARD"
                    bootDisk:
                      image: "projects/debian-cloud/global/images/family/debian-12"
                      size_gb: ${resources.disk}
                  installOpsAgent: true
              taskGroups:
                taskSpec:
                  volumes:
                    - gcs:
                        remotePath: ${gcsMountBucket}
                      mountPath: ${gcsMountPath}
                  computeResource:
                    cpuMilli: ${resources.cpu}
                    memoryMib: ${resources.memory}
                  runnables:
                    - container:
                        imageUri: ${imageUri}
                        commands:
                        - ${"--import_name=" + importName}
                        - ${"--import_config=" + importConfig}
                      environment:
                        variables:
                          IMPORT_NAME: ${importName}
                          BATCH_JOB_NAME: ${jobId}
                taskCount: 1
                parallelism: 1
              logsPolicy:
                destination: CLOUD_LOGGING
            connector_params:
              timeout: 604800 #7 days
              polling_policy:
                initial_delay: 60
                multiplier: 2
                max_delay: 600
          result: importJobResponse
        except:
          as: e
          steps:
            - updateImportStatus:
                call: http.post
                args:
                  url: ${helperUrl + "/imports/status"}
                  auth:
                    type: OIDC
                  body:
                    jobId: ${jobId}
                    imports:
                      - importName: ${importName}
                        status: 'FAILURE'
                        latestVersion: ${"gs://" + gcsImportBucket + "/" + text.replace_all(importName, ":", "/")}
                    executionTime: ${int(sys.now() - startTime)}
                result: functionResponse
            - failWorkflow:
                raise: ${e}
    - checkStagingEligible:
        switch:
          - condition: ${not runStaging}
            next: checkProdEligible
    - ingestStaging:
        call: ingestEnvironment
        args:
          projectId: ${projectId}
          region: ${region}
          importName: ${importName}
          helperService: ${helper_service}
          spannerWorkflow: ${spanner_workflow}
          waitIngestion: true
        result: stagingResult
    - checkProdEligible:
        switch:
          - condition: ${not runProd or (runStaging and stagingResult.status != "SUCCESS")}
            next: returnResult
    - ingestProd:
        call: ingestEnvironment
        args:
          projectId: ${projectId}
          region: ${region}
          importName: ${importName}
          helperService: ${helper_service}
          spannerWorkflow: ${spanner_workflow}
          waitIngestion: false
        result: prodResult
    - returnResult:
        return:
          jobId: ${jobId}
          importName: ${importName}
          staging: ${stagingResult}
          prod: ${prodResult}

ingestEnvironment:
  params: [projectId, region, importName, helperService, spannerWorkflow, waitIngestion]
  steps:
    - initSub:
        assign:
          - helperUrl: ${"https://" + helperService + "-" + sys.get_env("PROJECT_NUMBER") + "." + region + ".run.app"}
          - ingestionArgs:
              importList:
                - importName: ${text.split(importName, ":")[len(text.split(importName, ":")) - 1]}
          - ingestionExecutionResponse: null
    - updateImportVersion:
        call: http.post
        args:
          url: ${helperUrl + "/imports/version"}
          auth:
            type: OIDC
          body:
            imports:
              - ${importName}
            version: 'STAGING'
            override: false
            comment: '${"import-workflow:" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
        result: functionResponse
    - checkSkipIngestion:
        switch:
          - condition: '${not text.match_regex(functionResponse.body.message, ".*Status: STAGING.*")}'
            return:
              importName: ${importName}
              status: "SKIPPED"
              message: '${"Import status is not STAGING (" + functionResponse.body.message + "); skipped Spanner ingestion."}'
    - runSpannerIngestion:
        call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.create
        args:
          parent: ${"projects/" + projectId + "/locations/" + region + "/workflows/" + spannerWorkflow}
          body:
            argument: ${json.encode_to_string(ingestionArgs)}
          connector_params:
            timeout: 21600
            skip_polling: ${not waitIngestion}
        result: ingestionExecutionResponse
    - returnSubResult:
        return:
          importName: ${importName}
          status: "SUCCESS"
          ingestionExecution: ${ingestionExecutionResponse}