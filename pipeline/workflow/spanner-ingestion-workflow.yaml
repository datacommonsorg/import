main:
  params: [args]
  steps:
    - init:
        assign:
          - lock_timeout: 82800 # 23 hours
          - wait_period: 300 # seconds
          - project_id: '${sys.get_env("PROJECT_ID")}'
          - dataflow_job_name: ${"ingestion-job-" + string(int(sys.now()))}
          - dataflow_gcs_path: '${sys.get_env("DATAFLOW_TEMPLATE_PATH")}'
          - location: '${sys.get_env("LOCATION")}'
          - spanner_project_id: '${sys.get_env("SPANNER_PROJECT_ID")}'
          - spanner_instance_id: '${sys.get_env("SPANNER_INSTANCE_ID")}'
          - spanner_database_id: '${sys.get_env("SPANNER_DATABASE_ID")}'
          - helper_url: '${"https://ingestion-helper-service-" + sys.get_env("PROJECT_NUMBER") + "." + location + ".run.app"}'
          - workflow_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
          - import_list_input: ${args.importList}
          - pipeline_failed: false
          - failure_details: ""

    # Resolve import payload, register PENDING state, and log details
    - resolve_imports:
        call: initialize_imports
        args:
          helper_url: ${helper_url}
          workflow_id: '${workflow_id}'
          import_list: ${import_list_input}
          status: 'PENDING'
        result: import_info_list

    # Early exit if no imports are ready / staging
    - check_empty_imports:
        switch:
          - condition: ${len(import_info_list) == 0}
            return:
              status: "SKIPPED"
              message: "No staging imports found to ingest"
              importList: []

    # Acquire global ingestion lock on Spanner DB
    - acquire_ingestion_lock:
        try:
          call: http.post
          args:
            url: ${helper_url + "/database/lock/acquire"}
            auth:
              type: OIDC
            body:
              workflowId: '${workflow_id}'
              timeout: ${lock_timeout}
          result: lock_status
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 20
          backoff:
            initial_delay: 300
            max_delay: 600
            multiplier: 2

    # Pipeline Execution under Lock (Dataflow Ingestion, Aggregation, and Rollback on Failure)
    - run_pipeline_execution:
        try:
          steps:
            - run_ingestion:
                call: ingestion_subworkflow
                args:
                  import_list: ${import_info_list}
                  project_id: ${project_id}
                  job_name: ${dataflow_job_name}
                  template_gcs_path: ${dataflow_gcs_path}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                  helper_url: ${helper_url}
                  workflow_id: ${workflow_id}
                result: prod_job_id
            # SUCCESS state update on normal deployment completion
            - update_final_success_state:
                call: update_state_subworkflow
                args:
                  helper_url: ${helper_url}
                  workflow_id: '${workflow_id}'
                  status: 'SUCCESS'
                  import_list: ${import_info_list}
                result: final_state_response
        except:
          as: pipeline_err
          steps:
            - run_rollback:
                call: rollback_subworkflow
                args:
                  workflow_id: '${workflow_id}'
                  helper_url: ${helper_url}
                  import_list: ${import_info_list}
                  project_id: ${project_id}
                  dataflow_job_name: ${dataflow_job_name}
                  dataflow_gcs_path: ${dataflow_gcs_path}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                result: rollback_result
            - mark_pipeline_failed:
                assign:
                  - pipeline_failed: true
                  - failure_details: ${pipeline_err}

    # Release global ingestion lock on Spanner DB (only reached if normal deployment or rollback succeeded)
    - release_ingestion_lock:
        call: http.post
        args:
          url: ${helper_url + "/database/lock/release"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
        result: lock_release_response

    # If pipeline experienced a failure and completed rollback, fail the workflow to alert oncall
    - check_failure:
        switch:
          - condition: ${default(pipeline_failed, false)}
            raise: '${"Pipeline failed and rollback succeeded: " + json.encode_to_string(failure_details)}'

    - return_result:
        return:
          importList: ${import_info_list}

# Sub-workflow that fetches import details from /imports/info, logs, and registers initial state
initialize_imports:
  params: [helper_url, workflow_id, import_list, status]
  steps:
    - fetch_import_info:
        call: http.post
        args:
          url: ${helper_url + "/imports/info"}
          auth:
            type: OIDC
          body:
            importList: ${import_list}
        result: import_info_res
    - set_import_info:
        assign:
          - resolved_imports: ${import_info_res.body}
    - check_empty_imports:
        switch:
          - condition: ${len(resolved_imports) == 0}
            return: []
    - log_imports:
        call: sys.log
        args:
          text: '${"Import list: " + json.encode_to_string(resolved_imports)}'
          severity: INFO
    - register_state:
        call: update_state_subworkflow
        args:
          helper_url: ${helper_url}
          workflow_id: '${workflow_id}'
          status: '${status}'
          import_list: ${resolved_imports}
        result: state_response
    - return_imports:
        return: ${resolved_imports}

# Reusable sub-workflow that updates ingestion-history, and conditionally ingestion-status for SUCCESS or RETRY
update_state_subworkflow:
  params: [helper_url, workflow_id, status, import_list]
  steps:
    - check_update_status:
        switch:
          - condition: ${status == "SUCCESS" or status == "RETRY"}
            next: update_status
        next: update_history
    - update_status:
        call: http.post
        args:
          url: ${helper_url + "/imports/ingestion-status"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
            status: '${status}'
            importList: ${import_list}
        result: status_response
    - update_history:
        call: http.post
        args:
          url: ${helper_url + "/imports/ingestion-history"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
            status: '${status}'
            importList: ${import_list}
        result: history_response
    - return_result:
        return: ${history_response}

# Sub-workflow that executes Dataflow ingestion and Aggregation for a target Spanner database.
ingestion_subworkflow:
  params: [import_list, project_id, job_name, template_gcs_path, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period, helper_url, workflow_id]
  steps:
    - run_ingestion_job:
        call: run_dataflow_job
        args:
          import_list: '${json.encode_to_string(import_list)}'
          project_id: ${project_id}
          job_name: ${job_name}
          template_gcs_path: ${template_gcs_path}
          location: ${location}
          spanner_project_id: ${spanner_project_id}
          spanner_instance_id: ${spanner_instance_id}
          spanner_database_id: ${spanner_database_id}
          wait_period: ${wait_period}
          helper_url: ${helper_url}
          workflow_id: ${workflow_id}
        result: dataflow_job_id
    - run_aggregation_step:
        call: run_aggregation_job
        args:
          import_list: ${import_list}
          project_id: ${project_id}
          location: ${location}
          helper_url: ${helper_url}
          workflow_id: ${workflow_id}
        result: aggregation_job_res
    - return_job_id:
        return: ${default(dataflow_job_id, "N/A")}

# This sub-workflow runs aggregation jobs and waits for them to complete.
run_aggregation_job:
  params: [import_list, project_id, location, helper_url, workflow_id]
  steps:
    - run_aggregation:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project_id + "/locations/" + location + "/jobs/aggregation-helper-job"}
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--import_list"
                      - ${json.encode_to_string(import_list)}
                      - "--no-dry_run"
                      - "--config_path"
                      - "aggregation/configs/base_dc/common.yaml"
            connector_params:
              timeout: 21600
          result: aggregation_response
        except:
          as: agg_err
          raise:
            message: '${"Aggregation job failed: " + json.encode_to_string(agg_err)}'
            code: 500

# This sub-workflow launches a Dataflow job and waits for it to complete.
run_dataflow_job:
  params: [import_list, project_id, job_name, template_gcs_path, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period, helper_url, workflow_id]
  steps:
    - init:
        assign:
          - jobName: ${job_name}
          - machineType: 'n2-highmem-8'
          - numWorkers: 3
    - launch_job:
        call: googleapis.dataflow.v1b3.projects.locations.flexTemplates.launch
        args:
          projectId: '${project_id}'
          location: '${location}'
          body:
            launchParameter:
              containerSpecGcsPath: '${template_gcs_path}'
              jobName: '${jobName}'
              parameters:
                importList: '${import_list}'
                projectId: '${spanner_project_id}'
                spannerInstanceId: '${spanner_instance_id}'
                spannerDatabaseId: '${spanner_database_id}'
              environment:
                numWorkers: ${numWorkers}
                machineType: ${machineType}
        result: launch_result

    - wait_for_job_completion:
        call: sys.sleep
        args:
          seconds: ${wait_period}
        next: check_job_status
    - check_job_status:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.get
        args:
          projectId: '${project_id}'
          location: '${location}'
          jobId: '${launch_result.job.id}'
          view: 'JOB_VIEW_SUMMARY'
          query:
            fields: 'currentState'
        result: job_status
        next: check_if_done
    - check_if_done:
        switch:
          - condition: ${job_status.currentState == "JOB_STATE_DONE"}
            return: ${launch_result.job.id}
          - condition: ${job_status.currentState == "JOB_STATE_FAILED" or job_status.currentState == "JOB_STATE_CANCELLED"}
            raise:
              message: '${jobName + " dataflow job failed with status: " + job_status.currentState}'
              code: 500
              job_id: ${launch_result.job.id}
        next: wait_for_job_completion

# This sub-workflow performs rollback: sets state to RETRY, reverts imports, and retriggers ingestion.
# If rollback fails, it raises an error so the parent workflow skips lock release and alerts oncall.
rollback_subworkflow:
  params: [workflow_id, helper_url, import_list, project_id, dataflow_job_name, dataflow_gcs_path, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period]
  steps:
    - try_rollback_execution:
        try:
          steps:
            - revert_imports:
                call: http.post
                args:
                  url: ${helper_url + "/imports/revert"}
                  auth:
                    type: OIDC
                  body:
                    workflowId: '${workflow_id}'
                result: revert_res
            - resolve_retry_imports:
                call: initialize_imports
                args:
                  helper_url: ${helper_url}
                  workflow_id: '${workflow_id}'
                  import_list: ${revert_res.body.revertedImports}
                  status: 'RETRY'
                result: retry_import_info_list
            - check_empty_retry_imports:
                switch:
                  - condition: ${len(retry_import_info_list) == 0}
                    raise:
                      message: '${"Rollback failed: No restored staging imports resolved for workflow: " + workflow_id}'
                      code: 500
            - run_retry_ingestion:
                call: ingestion_subworkflow
                args:
                  import_list: ${retry_import_info_list}
                  project_id: ${project_id}
                  job_name: ${"ingestion-job-retry-" + string(int(sys.now()))}
                  template_gcs_path: ${dataflow_gcs_path}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                  helper_url: ${helper_url}
                  workflow_id: ${workflow_id}
                result: retry_ingestion_result
            - return_rollback_success:
                return:
                  status: "ROLLBACK_SUCCESS"
        except:
          as: retry_err
          steps:
            - raise_rollback_failure:
                raise: ${retry_err}
