main:
  params: [args]
  steps:
    - init:
        assign:
          - lock_timeout: 82800 # 23 hours
          - wait_period: ${int(default(map.get(args, "wait_period"), default(map.get(args, "waitPeriod"), 300)))}
          - project_id: '${sys.get_env("PROJECT_ID")}'
          - dataflow_job_name: ${"ingestion-job-" + string(int(sys.now()))}
          - aggregation_job_name: '${default(sys.get_env("AGGREGATION_JOB_NAME"), "aggregation-helper-job")}'
          - dataflow_gcs_path: '${default(sys.get_env("DATAFLOW_TEMPLATE_PATH"), "")}'
          - rollback_gcs_path: '${default(sys.get_env("ROLLBACK_TEMPLATE_PATH"), text.replace_all(default(dataflow_gcs_path, ""), "/ingestion-", "/rollback/rollback-"))}'
          - location: '${sys.get_env("LOCATION")}'
          - spanner_db_path: '${sys.get_env("SPANNER_DATABASE_PATH")}'
          - spanner_parts: '${text.split(spanner_db_path, "/")}'
          - spanner_project_id: '${spanner_parts[1]}'
          - spanner_instance_id: '${spanner_parts[3]}'
          - spanner_database_id: '${spanner_parts[5]}'
          - helper_service: '${default(sys.get_env("INGESTION_HELPER_SERVICE"), "ingestion-helper-service")}'
          - helper_url: '${"https://" + helper_service + "-" + sys.get_env("PROJECT_NUMBER") + "." + location + ".run.app"}'
          - workflow_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
          - import_info_list: ${default(map.get(args, "importList"), [])}
          - pipeline_failed: false
          - failure_details: ""

    # Early exit if no imports are ready / staging
    - check_empty_imports:
        switch:
          - condition: ${len(import_info_list) == 0}
            return:
              status: "SKIPPED"
              message: "No staging imports found to ingest"
              importList: []

    # Log import details and register initial PENDING state
    - log_imports:
        call: sys.log
        args:
          text: '${"Import list: " + json.encode_to_string(import_info_list)}'
          severity: INFO
    - register_initial_state:
        call: update_state_subworkflow
        args:
          helper_url: ${helper_url}
          workflow_id: '${workflow_id}'
          status: 'PENDING'
          import_list: ${import_info_list}
          job_id: null
        result: initial_state_response

    # Acquire global ingestion lock on Spanner DB
    - acquire_ingestion_lock:
        try:
          call: http.post
          args:
            url: ${helper_url + "/database/lock/acquire"}
            auth:
              type: OIDC
            body:
              workflowId: '${workflow_id}'
              timeout: ${lock_timeout}
          result: lock_status
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 60
          backoff:
            initial_delay: ${wait_period}
            max_delay: ${wait_period}
            multiplier: 1

    # Capture pre-ingestion timestamp (T_pre) under lock for Spanner rollback
    - record_rollback_timestamp:
        assign:
          - rollback_timestamp: ${time.format(sys.now())}

    # Pipeline Execution under Lock (Dataflow Ingestion, Aggregation, and Rollback on Failure)
    - run_pipeline_execution:
        try:
          steps:
            - run_ingestion:
                call: ingestion_subworkflow
                args:
                  import_list: ${import_info_list}
                  project_id: ${project_id}
                  job_name: ${dataflow_job_name}
                  template_gcs_path: ${dataflow_gcs_path}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                  helper_url: ${helper_url}
                  workflow_id: ${workflow_id}
                  aggregation_job_name: ${aggregation_job_name}
                result: ingestion_res
            # SUCCESS state update on normal deployment completion
            - update_final_success_state:
                call: update_state_subworkflow
                args:
                  helper_url: ${helper_url}
                  workflow_id: '${workflow_id}'
                  status: 'SUCCESS'
                  import_list: ${import_info_list}
                  job_id: ${ingestion_res.dataflowJobId}
                result: final_state_response
        except:
          as: pipeline_err
          steps:
            - run_rollback:
                call: rollback_subworkflow
                args:
                  workflow_id: '${workflow_id}'
                  helper_url: ${helper_url}
                  import_list: ${import_info_list}
                  project_id: ${project_id}
                  rollback_gcs_path: ${rollback_gcs_path}
                  rollback_timestamp: ${rollback_timestamp}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                  pipeline_err: ${pipeline_err}
                result: rollback_result
            - mark_pipeline_failed:
                assign:
                  - pipeline_failed: true
                  - failure_details: ${pipeline_err}

    # Release global ingestion lock on Spanner DB (only reached if normal deployment or rollback succeeded)
    - release_ingestion_lock:
        call: http.post
        args:
          url: ${helper_url + "/database/lock/release"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
        result: lock_release_response

    # If pipeline experienced a failure and completed rollback, fail the workflow to alert oncall
    - raise_rollback_completed:
        switch:
          - condition: ${default(pipeline_failed, false)}
            raise: '${"Pipeline failed and rollback succeeded: " + json.encode_to_string(failure_details)}'

    - return_result:
        return:
          status: "SUCCESS"
          workflowId: ${workflow_id}
          dataflowJobId: ${ingestion_res.dataflowJobId}
          aggregationJobRunId: ${ingestion_res.aggregationJobRunId}
          database: ${spanner_db_path}
          importList: ${import_info_list}

# Reusable sub-workflow that updates ingestion-history, and conditionally ingestion-status for SUCCESS or RETRY
update_state_subworkflow:
  params: [helper_url, workflow_id, status, import_list, job_id]
  steps:
    - check_update_status:
        switch:
          - condition: ${status == "SUCCESS" or status == "RETRY"}
            next: update_status
        next: update_history
    - update_status:
        call: http.post
        args:
          url: ${helper_url + "/imports/ingestion-status"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
            status: '${status}'
            importList: ${import_list}
            jobId: ${job_id}
        result: status_response
    - update_history:
        call: http.post
        args:
          url: ${helper_url + "/imports/ingestion-history"}
          auth:
            type: OIDC
          body:
            workflowId: '${workflow_id}'
            status: '${status}'
            importList: ${import_list}
            jobId: ${job_id}
        result: history_response
    - return_result:
        return: ${history_response}

# Sub-workflow that executes Dataflow ingestion and Aggregation for a target Spanner database.
ingestion_subworkflow:
  params: [import_list, project_id, job_name, template_gcs_path, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period, helper_url, workflow_id, aggregation_job_name]
  steps:
    - run_ingestion_job:
        call: run_dataflow_job
        args:
          import_list: '${json.encode_to_string(import_list)}'
          project_id: ${project_id}
          job_name: ${job_name}
          template_gcs_path: ${template_gcs_path}
          location: ${location}
          spanner_project_id: ${spanner_project_id}
          spanner_instance_id: ${spanner_instance_id}
          spanner_database_id: ${spanner_database_id}
          wait_period: ${wait_period}
          helper_url: ${helper_url}
          workflow_id: ${workflow_id}
          rollback_timestamp: null
        result: dataflow_job_id
    - run_aggregation_step:
        call: run_aggregation_job
        args:
          import_list: ${import_list}
          project_id: ${project_id}
          location: ${location}
          helper_url: ${helper_url}
          workflow_id: ${workflow_id}
          aggregation_job_name: ${aggregation_job_name}
        result: aggregation_job_run_id
    - log_jobs:
        call: sys.log
        args:
          text: '${"Ingestion jobs - Dataflow Job ID: " + string(dataflow_job_id) + ", Aggregation Job Run ID: " + string(aggregation_job_run_id)}'
          severity: INFO
    - return_sub_result:
        return:
          dataflowJobId: ${default(dataflow_job_id, "N/A")}
          aggregationJobRunId: ${default(aggregation_job_run_id, "N/A")}

# This sub-workflow runs aggregation jobs and waits for them to complete.
run_aggregation_job:
  params: [import_list, project_id, location, helper_url, workflow_id, aggregation_job_name]
  steps:
    - run_aggregation:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project_id + "/locations/" + location + "/jobs/" + aggregation_job_name}
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--import_list"
                      - ${json.encode_to_string(import_list)}
                      - "--no-dry_run"
                      - "--config_path"
                      - "aggregation/configs/base_dc/common.yaml"
            connector_params:
              timeout: 21600
          result: aggregation_response
        except:
          as: agg_err
          raise:
            message: '${"Aggregation job failed: " + json.encode_to_string(agg_err)}'
            code: 500
    - return_aggregation_result:
        return: ${default(aggregation_response.response.name, default(aggregation_response.metadata.name, default(aggregation_response.name, "N/A")))}

# This sub-workflow launches a Dataflow job and waits for it to complete.
run_dataflow_job:
  params: [import_list, project_id, job_name, template_gcs_path, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period, helper_url, workflow_id, {rollback_timestamp: null}]
  steps:
    - init:
        assign:
          - jobName: ${job_name}
          - machineType: 'n2-highmem-8'
          - numWorkers: 3
          - maxWorkers: 20
          - jobParameters:
              importList: '${import_list}'
              projectId: '${spanner_project_id}'
              spannerInstanceId: '${spanner_instance_id}'
              spannerDatabaseId: '${spanner_database_id}'
    - check_rollback_timestamp:
        switch:
          - condition: ${rollback_timestamp != null and rollback_timestamp != ""}
            assign:
              - jobParameters["rollbackTimestamp"]: '${rollback_timestamp}'
    - launch_job:
        call: googleapis.dataflow.v1b3.projects.locations.flexTemplates.launch
        args:
          projectId: '${project_id}'
          location: '${location}'
          body:
            launchParameter:
              containerSpecGcsPath: '${template_gcs_path}'
              jobName: '${jobName}'
              parameters: ${jobParameters}
              environment:
                numWorkers: ${numWorkers}
                maxWorkers: ${maxWorkers}
                machineType: ${machineType}
        result: launch_result

    - wait_for_job_completion:
        call: sys.sleep
        args:
          seconds: ${wait_period}
        next: check_job_status
    - check_job_status:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.get
        args:
          projectId: '${project_id}'
          location: '${location}'
          jobId: '${launch_result.job.id}'
          view: 'JOB_VIEW_SUMMARY'
          query:
            fields: 'currentState'
        result: job_status
        next: check_if_done
    - check_if_done:
        switch:
          - condition: ${job_status.currentState == "JOB_STATE_DONE"}
            return: ${launch_result.job.id}
          - condition: ${job_status.currentState == "JOB_STATE_FAILED" or job_status.currentState == "JOB_STATE_CANCELLED"}
            raise:
              message: '${jobName + " dataflow job failed with status: " + job_status.currentState}'
              code: 500
              job_id: ${launch_result.job.id}
        next: wait_for_job_completion

# This sub-workflow performs Spanner rollback to rollback_timestamp (T_pre) using the rollback Dataflow pipeline
# and marks the imports and workflow history as RETRY.
# If rollback fails, it raises an error so the parent workflow skips lock release and alerts oncall.
rollback_subworkflow:
  params: [workflow_id, helper_url, import_list, project_id, rollback_gcs_path, rollback_timestamp, location, spanner_project_id, spanner_instance_id, spanner_database_id, wait_period, {pipeline_err: null}]
  steps:
    - try_rollback_execution:
        try:
          steps:
            - log_rollback_start:
                call: sys.log
                args:
                  text: '${"Starting rollback to timestamp " + rollback_timestamp + " for imports: " + json.encode_to_string(import_list)}'
                  severity: WARNING
            - run_rollback_job:
                call: run_dataflow_job
                args:
                  import_list: '${json.encode_to_string(import_list)}'
                  project_id: ${project_id}
                  job_name: ${"rollback-job-" + string(int(sys.now()))}
                  template_gcs_path: ${rollback_gcs_path}
                  location: ${location}
                  spanner_project_id: ${spanner_project_id}
                  spanner_instance_id: ${spanner_instance_id}
                  spanner_database_id: ${spanner_database_id}
                  wait_period: ${wait_period}
                  helper_url: ${helper_url}
                  workflow_id: ${workflow_id}
                  rollback_timestamp: ${rollback_timestamp}
                result: rollback_job_id
            - update_retry_state:
                call: update_state_subworkflow
                args:
                  helper_url: ${helper_url}
                  workflow_id: '${workflow_id}'
                  status: 'RETRY'
                  import_list: ${import_list}
                  job_id: ${rollback_job_id}
                result: retry_state_response
            - log_rollback_complete:
                call: sys.log
                args:
                  text: '${"Rollback completed successfully - Rollback Dataflow Job ID: " + string(rollback_job_id)}'
                  severity: INFO
            - return_rollback_success:
                return:
                  status: "ROLLBACK_SUCCESS"
                  rollbackJobId: ${default(rollback_job_id, "N/A")}
        except:
          as: retry_err
          steps:
            - raise_rollback_failure:
                raise:
                  message: '${"Pipeline failed and rollback also failed. Original error: " + json.encode_to_string(pipeline_err) + " | Rollback error: " + json.encode_to_string(retry_err)}'
                  code: 500
