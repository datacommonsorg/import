# CI/CD Execution (Triggered automatically on push to master touching simple/**):
# - Pushes tags: 'latest' and commit SHORT_SHA to gcr.io/datcom-ci/datacommons-data
#
# Manual/Local Execution:
# - Run ./simple/scripts/push_image.sh <image-tag> [project-id]

steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: "bash"
    args:
      - -c
      - |
        docker pull gcr.io/datcom-ci/datacommons-data:latest || true

  - id: build-and-push-datacommons-data
    name: gcr.io/cloud-builders/docker
    dir: ${_BUILD_DIR}
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        DOCKER_BUILDKIT=1 docker build -f Dockerfile \
          --cache-from gcr.io/datcom-ci/datacommons-data:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --tag gcr.io/${_PROJECT_ID}/datacommons-data:${_TAG} \
          --tag gcr.io/${_PROJECT_ID}/datacommons-data:${_VERSION} \
          .
        docker push gcr.io/${_PROJECT_ID}/datacommons-data:${_TAG}
        if [[ "${_VERSION}" != "${_TAG}" ]]; then
          docker push gcr.io/${_PROJECT_ID}/datacommons-data:${_VERSION}
        fi
    waitFor: ["pull-cache"]

substitutions:
  # _BUILD_DIR is the directory containing the Dockerfile, relative to the top
  # level of the files sent to Cloud Build. Automated triggers send the whole
  # repo, so the default is "simple".
  _BUILD_DIR: "simple"
  _PROJECT_ID: "datcom-ci"
  _TAG: "latest"
  _VERSION: "${SHORT_SHA}"

timeout: 3600s
options:
  dynamic_substitutions: true
  machineType: "E2_HIGHCPU_32"
