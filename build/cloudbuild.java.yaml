# This cloud build is triggered when there is code change, but can also involve
# data change.

# Generate protoc, build, check-format and run test
steps:
  - id: "format & test"
    name: "maven:3-openjdk-17"
    entrypoint: "mvn"
    args:
      - "-B"
      - "-ntp"
      - "-T"
      - "1C"
      - "-Dmaven.artifact.threads=32"
      - "com.spotify.fmt:fmt-maven-plugin:check"
      - "test"
    # Activates the Maven coverage profile: JaCoCo writes
    # <module>/target/site/jacoco/jacoco.xml. Report-only: no thresholds.
    env:
      - JAVA_TEST_COVERAGE=1
    secretEnv:
      - DC_API_KEY

  # Logs each module's line coverage and the coverage of the lines the PR
  # changes, vs the PR's base branch. Report-only: always succeeds.
  - id: changed_lines_coverage
    name: python:3.11.3
    entrypoint: bash
    env:
      - COVERAGE_BASE_BRANCH=$_BASE_BRANCH
      - COVERAGE_REMOTE=https://github.com/$REPO_FULL_NAME
    args:
      - -c
      - |
        d=$(mktemp -d) && trap 'rm -rf "$$d"' EXIT
        for f in print_jacoco_coverage.py report_changed_lines.sh; do
          curl -fsSL --retry 3 -o "$$d/$$f" "$_SHARED_SCRIPTS_URL/$$f" \
            || { echo "Coverage report skipped: script download failed"; exit 0; }
        done
        pip install -q diff-cover==11.0.0 || exit 0
        shopt -s nullglob
        reports=(*/target/site/jacoco/jacoco.xml pipeline/*/target/site/jacoco/jacoco.xml)
        python3 "$$d/print_jacoco_coverage.py" "$${reports[@]}" \
          || echo "Module coverage not printed (report-only)"
        bash "$$d/report_changed_lines.sh" "$${reports[@]}" \
          --src-roots */src/main/java pipeline/*/src/main/java \
          || echo "Changed-line coverage not measured (report-only)"
    waitFor: ["format & test"]

  # Uploads the coverage that the tests wrote to Codacy, with each module's
  # source root as the prefix of its report's paths. Report-only: always
  # succeeds, and skips when there's no token.
  - id: upload_coverage
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:593.0.0-slim
    entrypoint: bash
    args:
      - -c
      - |
        s=$(mktemp) && trap 'rm -f "$$s"' EXIT
        curl -fsSL --retry 3 -o "$$s" "$_SHARED_SCRIPTS_URL/upload_coverage.sh" \
          || { echo "Codacy upload skipped: script download failed"; exit 0; }
        shopt -s nullglob
        reports=()
        for r in */target/site/jacoco/jacoco.xml pipeline/*/target/site/jacoco/jacoco.xml; do
          reports+=("$$r:$${r%target/site/jacoco/jacoco.xml}src/main/java/")
        done
        bash "$$s" "$${reports[@]}" || echo "Codacy upload failed (report-only)"
    env:
      - COMMIT_SHA=$COMMIT_SHA
      - BRANCH_NAME=$BRANCH_NAME
      - _BASE_BRANCH=$_BASE_BRANCH
      - CODACY_DEFAULT_BRANCH=master
      - CODACY_SECRET_NAME=codacy-project-token-import
    waitFor: ["format & test"]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dc-api-key/versions/latest
      env: DC_API_KEY

substitutions:
  _SHARED_SCRIPTS_URL: https://raw.githubusercontent.com/datacommonsorg/.github/main/scripts

options:
  machineType: "E2_HIGHCPU_8"
  substitutionOption: "ALLOW_LOOSE"

