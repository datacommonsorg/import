# Run Python tests, lint, etc.
steps:
  - id: py_test
    name: python:3.11.3
    entrypoint: /bin/sh
    # PY_TEST_COVERAGE makes -p also log coverage of simple/ and of the lines
    # the PR changes, vs the PR's base branch. The report never fails the step.
    env:
      - PY_TEST_COVERAGE=1
      - COVERAGE_BASE_BRANCH=$_BASE_BRANCH
      - COVERAGE_REMOTE=https://github.com/$REPO_FULL_NAME
      - SHARED_COVERAGE_SCRIPTS_URL=$_SHARED_SCRIPTS_URL
    args:
      - -c
      - |
        ./run_test.sh -l -p

  # Uploads the coverage that py_test wrote to Codacy. Report-only: always
  # succeeds, and skips when there's no token.
  - id: upload_coverage
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:593.0.0-slim
    entrypoint: bash
    args:
      - -c
      - |
        s=$(mktemp) && trap 'rm -f "$$s"' EXIT
        curl -fsSL --retry 3 -o "$$s" "$_SHARED_SCRIPTS_URL/upload_coverage.sh" \
          || { echo "Codacy upload skipped: script download failed"; exit 0; }
        bash "$$s" simple/coverage.xml \
          || echo "Codacy upload failed (report-only)"
    env:
      - COMMIT_SHA=$COMMIT_SHA
      - BRANCH_NAME=$BRANCH_NAME
      - _BASE_BRANCH=$_BASE_BRANCH
      - CODACY_DEFAULT_BRANCH=master
      - CODACY_SECRET_NAME=codacy-project-token-import
    waitFor: ["py_test"]

substitutions:
  _SHARED_SCRIPTS_URL: https://raw.githubusercontent.com/datacommonsorg/.github/main/scripts

options:
  machineType: "E2_HIGHCPU_32"
  substitutionOption: "ALLOW_LOOSE"

